name: ytId emulator check

on:
  push:
    branches: [ci/ytid-emulator]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytid-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, playstore]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.flavor }}Debug APK
        run: |
          touch local.properties
          task=assemble$(echo ${{ matrix.flavor }} | sed 's/./\U&/')Debug
          ./gradlew :androidApp:$task -Pnuvio.android.distribution=${{ matrix.flavor }} -Pnuvio.ios.distribution=appstore --stacktrace
          ls -la androidApp/build/outputs/apk/${{ matrix.flavor }}/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 .ci-ytid/drive.py "$PWD/ci-out" "androidApp/build/outputs/apk/${{ matrix.flavor }}/debug/androidApp-${{ matrix.flavor }}-debug.apk" ${{ matrix.flavor }} || true

      - name: Publish results to a branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out && cd ci-out
          grep -E "NuvioPlayer|InAppYouTubeExtractor|YTChunked|ExoPlayer|MediaCodec|CCodec|AndroidRuntime|FATAL" logcat.txt > logcat-player.txt 2>/dev/null || true
          gzip -f logcat.txt 2>/dev/null || true
          git init -q
          git config user.name deejay189393
          git config user.email deejay189393@gmail.com
          git checkout -q -b results
          git add -A
          git commit -q -m "ytId emulator results (${{ matrix.flavor }}, run ${{ github.run_number }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-results/${{ github.run_number }}-${{ matrix.flavor }}
