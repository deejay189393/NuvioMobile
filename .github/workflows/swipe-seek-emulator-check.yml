name: Swipe seek emulator check

on:
  push:
    branches: [ci/swipe-seek-emulator]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swipe-seek-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator:
    name: Emulator (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fixed
            baseline: false
          - name: baseline
            baseline: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Revert the fix (baseline only)
        if: matrix.baseline
        run: |
          git config user.name ci && git config user.email ci@localhost
          git revert --no-edit "$(git log --format=%H -1 --grep='^fix(player): show the swipe-to-seek preview')"
          git log --oneline -3

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build fullDebug APK
        run: |
          touch local.properties
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
          ls -la androidApp/build/outputs/apk/full/debug/

      - name: Free memory for the emulator
        run: |
          ./gradlew --stop || true
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 8G
          cores: 3
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 .ci-seek/drive.py "$PWD/ci-out" "androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk" ${{ matrix.name }} || true

      - name: Publish results to a branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out && cd ci-out
          grep -E "NuvioPlayer|ExoPlayer|MediaCodec|AndroidRuntime|FATAL" logcat.txt > logcat-player.txt 2>/dev/null || true
          gzip -f logcat.txt 2>/dev/null || true
          git init -q
          git config user.name deejay189393
          git config user.email deejay189393@gmail.com
          git checkout -q -b results
          git add -A
          git commit -q -m "swipe seek emulator results (${{ matrix.name }}, run ${{ github.run_number }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-results/seek-${{ github.run_number }}-${{ matrix.name }}
